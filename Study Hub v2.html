<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Hub — Wirtschaftsinformatik</title>
<style>
  :root {
    --bg: #0e0e12;
    --surface: #16161c;
    --surface-2: #1c1c24;
    --border: #2a2a35;
    --accent: #6B6EF9;
    --accent-dim: rgba(107, 110, 249, 0.14);
    --text: #e9e9f0;
    --muted: #8b8b9c;
    --red: #f06a6a;
    --amber: #e3b04b;
    --green: #5bc78a;
    --code-bg: #0a0a0f;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select, textarea {
    font: inherit;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.55rem 0.75rem;
    transition: border-color 200ms;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input:hover, select:hover, textarea:hover { border-color: #3a3a4a; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
  input[type="date"] { color-scheme: dark; }

  /* ---------- Layout ---------- */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 1.25rem 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand {
    font-weight: 700;
    font-size: 1.05rem;
    padding: 0.5rem 0.75rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 0.72rem; }
  .nav-btn {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    color: var(--muted);
    transition: background 200ms, color 200ms;
    text-align: left;
    width: 100%;
  }
  .nav-btn svg { flex-shrink: 0; }
  .nav-btn:hover { background: var(--surface); color: var(--text); }
  .nav-btn.active { background: var(--accent-dim); color: var(--accent); }
  .sidebar-bottom { margin-top: auto; }
  .main {
    flex: 1;
    padding: 2rem 2.25rem 3rem;
    max-width: 1600px;
    min-width: 0;
    margin: 0 auto;
    width: 100%;
    transition: max-width 200ms;
  }
  .main.narrow { max-width: 960px; }
  .page-title { font-size: 1.45rem; font-weight: 700; margin-bottom: 0.25rem; }
  .page-sub { color: var(--muted); margin-bottom: 1.75rem; }
  .page-sub.tight { margin-bottom: 0.5rem; }

  /* ---------- Typed status line ---------- */
  .status-line {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 1.75rem;
    min-height: 1.3em;
  }
  .status-line .arrow { color: var(--accent); }
  .type-cursor {
    display: inline-block;
    width: 0.55ch;
    height: 1em;
    background: var(--accent);
    vertical-align: -0.12em;
    margin-left: 2px;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .type-cursor { animation: none; } }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
  }
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .metric-card { cursor: pointer; text-align: left; width: 100%; transition: border-color 200ms; display: flex; flex-direction: column; align-items: flex-start; }
  .metric-card:hover { border-color: var(--accent); }
  .metric-label { display: block; color: var(--muted); font-size: 0.82rem; margin-bottom: 0.35rem; }
  .metric-value { display: block; font-size: 1.9rem; font-weight: 700; line-height: 1.15; }
  .metric-value .unit { font-size: 0.95rem; font-weight: 500; color: var(--muted); margin-left: 0.3rem; }
  .metric-value.accent { color: var(--accent); }

  .section-h { font-size: 1.05rem; font-weight: 600; margin: 1.75rem 0 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .card-h { font-size: 0.82rem; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.5rem 0.95rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 0.88rem;
    font-weight: 500;
    transition: background 200ms, border-color 200ms, color 200ms;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #5a5de0; }
  .btn.ghost { background: none; border-color: transparent; color: var(--muted); padding: 0.35rem 0.6rem; }
  .btn.ghost:hover { color: var(--text); background: var(--surface-2); }
  .btn.danger-armed { background: var(--red); border-color: var(--red); color: #fff; }

  /* ---------- Badges & pills ---------- */
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.18rem 0.55rem;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .badge.indigo { background: var(--accent-dim); color: var(--accent); }
  .badge.red { background: rgba(240,106,106,0.14); color: var(--red); }
  .badge.amber { background: rgba(227,176,75,0.14); color: var(--amber); }
  .badge.green { background: rgba(91,199,138,0.14); color: var(--green); }
  .pill {
    display: inline-block;
    font-size: 0.74rem;
    font-weight: 600;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: border-color 200ms, background 200ms, color 200ms;
  }
  button.pill { cursor: pointer; }
  button.pill:hover { border-color: var(--accent); }
  .due-tag { font-family: var(--mono); font-size: 0.7rem; white-space: nowrap; }
  .due-tag.overdue { color: var(--red); }
  .due-tag.soon { color: var(--amber); }
  .due-tag.normal { color: var(--muted); }

  /* ---------- Countdown rings ---------- */
  .ring-row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .ring-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    min-width: 168px;
  }
  .ring-wrap { position: relative; width: 120px; height: 120px; }
  .ring-wrap svg { transform: rotate(-90deg); display: block; }
  .ring-fg { transition: stroke-dashoffset 1s ease; }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .ring-days { font-size: 22px; font-weight: 700; }
  .ring-days.today { color: var(--accent); font-size: 17px; }
  .ring-label { font-size: 11px; color: var(--muted); }
  .ring-subject { font-weight: 600; }
  .ring-date { font-size: 0.78rem; color: var(--muted); }

  /* ---------- Dashboard grid ---------- */
  .dash-grid { display: grid; grid-template-columns: 3fr 2fr; gap: 1rem; margin-top: 1.5rem; align-items: start; }
  .dash-col { display: flex; flex-direction: column; gap: 1rem; }
  .feed-item {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    width: 100%;
    text-align: left;
    padding: 0.6rem 0.4rem;
    border-radius: 8px;
    transition: background 200ms;
  }
  .feed-item:hover { background: var(--surface-2); }
  .feed-item + .feed-item { border-top: 1px solid var(--border); border-radius: 0; }
  .feed-icon {
    width: 32px; height: 32px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 8px;
    border: 1px solid var(--border);
    color: var(--accent);
    background: var(--accent-dim);
  }
  .feed-title { font-size: 0.9rem; font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed-time { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
  .feed-body { flex: 1; min-width: 0; }

  .pomo-time { font-family: var(--mono); font-size: 2.7rem; font-weight: 700; line-height: 1.1; letter-spacing: 0.02em; }
  .pomo-time.break { color: var(--green); }
  .pomo-phase { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.4rem; }
  .pomo-actions { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }

  .progress-track { height: 6px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; margin-top: 0.75rem; }
  .progress-fill { height: 100%; background: var(--accent); transition: width 1s ease; }
  .progress-meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); margin-top: 0.5rem; }

  /* ---------- Exams ---------- */
  .exam-list { display: flex; flex-direction: column; gap: 1rem; }
  .exam-card { display: flex; align-items: center; gap: 1.5rem; }
  .exam-card.past { opacity: 0.45; }
  .exam-info { flex: 1; min-width: 0; }
  .exam-name { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.2rem; display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
  .exam-date { color: var(--muted); font-size: 0.9rem; }
  .inline-form { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.25rem; }
  details.past-section summary {
    cursor: pointer;
    color: var(--muted);
    font-weight: 600;
    padding: 0.5rem 0;
    transition: color 200ms;
    list-style: none;
  }
  details.past-section summary::before { content: "▸ "; }
  details.past-section[open] summary::before { content: "▾ "; }
  details.past-section summary:hover { color: var(--text); }
  details.past-section .exam-list { margin-top: 0.75rem; }

  /* ---------- Kanban ---------- */
  .kanban { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; align-items: start; }
  .kcol {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    min-height: 220px;
    transition: border-color 200ms;
  }
  .kcol.drag-over { border-color: var(--accent); }
  .kcol-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.85rem; padding: 0 0.25rem; }
  .kcol-title { font-size: 0.85rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; display: flex; align-items: center; gap: 0.5rem; }
  .kcount { font-size: 0.72rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0.05rem 0.5rem; }
  .kcards { display: flex; flex-direction: column; gap: 0.6rem; }
  .tcard {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.8rem 0.9rem;
    cursor: grab;
    transition: border-color 200ms;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }
  .tcard:hover { border-color: #3a3a4a; }
  .tcard.dragging { opacity: 0.4; }
  .tcard-top { display: flex; align-items: flex-start; gap: 0.55rem; }
  .prio-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 0.42rem; }
  .tcard-title { flex: 1; font-size: 0.92rem; }
  .tcard.done-card .tcard-title { text-decoration: line-through; }
  .tcard.done-card { opacity: 0.55; }
  .tcard-meta { display: flex; align-items: center; gap: 0.5rem; justify-content: space-between; flex-wrap: wrap; }
  .tcard-meta-left { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
  .tcard .btn.ghost { font-size: 0.76rem; }
  .add-task-form { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.6rem; }
  .add-task-form .row { display: flex; gap: 0.5rem; }
  .add-task-form input[type="text"] { flex: 1; min-width: 0; }
  .add-task-form input[type="date"] { font-size: 0.85rem; }
  .add-task-form select { flex: 1; min-width: 0; font-size: 0.85rem; padding: 0.45rem 0.5rem; }

  /* ---------- Notes ---------- */
  .notes-layout { display: grid; grid-template-columns: 300px 1fr; gap: 1rem; align-items: start; }
  .note-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.75rem; }
  .note-item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
    cursor: pointer;
    text-align: left;
    width: 100%;
    transition: border-color 200ms, background 200ms;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .note-item:hover { border-color: #3a3a4a; }
  .note-item.selected { border-color: var(--accent); }
  .note-item-title { font-weight: 600; font-size: 0.92rem; }
  .note-item-meta { display: flex; align-items: center; gap: 0.5rem; font-size: 0.74rem; color: var(--muted); flex-wrap: wrap; }
  .note-view-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .note-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
  .note-title-input { font-size: 1.15rem; font-weight: 700; width: 100%; margin-bottom: 0.75rem; }
  .subject-pills { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.9rem; }

  /* ---------- Rich text editor ---------- */
  .rte-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.2rem;
    border: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: 10px;
    padding: 0.4rem 0.5rem;
    margin-bottom: 0.75rem;
  }
  .rt-btn {
    display: grid;
    place-items: center;
    min-width: 30px;
    height: 30px;
    padding: 0 0.4rem;
    border-radius: 6px;
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 600;
    transition: background 200ms, color 200ms;
  }
  .rt-btn:hover { background: var(--accent-dim); color: var(--accent); }
  .rt-select {
    padding: 0.28rem 0.4rem;
    font-size: 0.8rem;
    border-radius: 6px;
    background: var(--surface);
  }
  .rt-divider { width: 1px; height: 20px; background: var(--border); margin: 0 0.35rem; flex-shrink: 0; }
  .rt-swatch {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid var(--border);
    margin: 0 2px;
    transition: transform 200ms, border-color 200ms;
  }
  .rt-swatch:hover { transform: scale(1.2); border-color: var(--text); }
  .rte-editor {
    min-height: 320px;
    max-height: 60vh;
    overflow-y: auto;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.15rem;
    line-height: 1.65;
  }
  .rte-editor:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
  .rte-editor:empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
  .rte-editor ul, .rte-editor ol, .note-html ul, .note-html ol { margin: 0.5rem 0 0.5rem 1.5rem; }
  .rte-editor li, .note-html li { margin: 0.2rem 0; }
  .note-html p { margin: 0.5rem 0; }
  .note-html p:first-child { margin-top: 0; }
  .note-html h1 { font-size: 1.4rem; margin: 1.1rem 0 0.5rem; }
  .note-html h2 { font-size: 1.15rem; margin: 1rem 0 0.45rem; }
  .note-html h3 { font-size: 1rem; margin: 0.9rem 0 0.4rem; }
  .note-html h1:first-child, .note-html h2:first-child, .note-html h3:first-child { margin-top: 0; }
  .note-html code {
    font-family: var(--mono);
    font-size: 0.84em;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.1em 0.4em;
  }
  .note-html pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    overflow-x: auto;
    margin: 0.75rem 0;
  }
  .note-html pre code { background: none; border: none; padding: 0; font-size: 0.84rem; line-height: 1.55; }

  /* ---------- Snippets ---------- */
  .snippet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
  .snippet-card { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
  .snippet-head { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; }
  .snippet-title { font-weight: 600; flex: 1; min-width: 0; }
  .snippet-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
  .snippet-desc { font-size: 0.82rem; color: var(--muted); flex: 1; min-width: 0; }
  .snippet-foot-right { display: flex; align-items: center; gap: 0.6rem; font-family: var(--mono); font-size: 0.7rem; color: var(--muted); flex-shrink: 0; }
  .snippet-pre {
    position: relative;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 0;
  }
  .snippet-pre pre { padding: 1rem; overflow-x: auto; max-height: 280px; overflow-y: auto; }
  .snippet-pre code { font-family: var(--mono); font-size: 0.82rem; line-height: 1.55; }
  .copy-btn {
    position: absolute;
    top: 0.55rem;
    right: 0.55rem;
    font-size: 0.74rem;
    font-weight: 600;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.25rem 0.6rem;
    color: var(--muted);
    opacity: 0;
    transition: opacity 200ms, color 200ms, border-color 200ms;
  }
  .snippet-pre:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
  .lang-tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .snippet-form { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem; }
  .snippet-form .row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .snippet-form .row input { flex: 2; min-width: 180px; }
  .snippet-form .row select { flex: 1; min-width: 120px; }
  .snippet-form textarea { font-family: var(--mono); font-size: 0.84rem; min-height: 160px; resize: vertical; }
  .form-actions { display: flex; gap: 0.5rem; }
  .search-bar { width: 100%; margin-bottom: 1rem; font-family: var(--mono); font-size: 0.88rem; }

  /* ---------- Quick add ---------- */
  .quick-add { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
  .quick-add input { flex: 1; }

  /* ---------- Footer ---------- */
  .app-footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .app-footer .links { display: flex; gap: 0.25rem; flex-wrap: wrap; }
  .app-footer button {
    color: var(--muted);
    padding: 0.25rem 0.55rem;
    border-radius: 6px;
    transition: color 200ms, background 200ms;
  }
  .app-footer button:hover { color: var(--accent); background: var(--surface); }
  .import-bar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    color: var(--amber);
  }
  .import-bar .btn { font-size: 0.74rem; padding: 0.3rem 0.7rem; }

  /* ---------- Empty states ---------- */
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 3rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }
  .empty svg { opacity: 0.5; }

  /* ---------- Mobile ---------- */
  @media (max-width: 1100px) {
    .dash-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    .kanban { grid-template-columns: 1fr; }
    .notes-layout { grid-template-columns: 1fr; }
    .snippet-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 768px) {
    .app { flex-direction: column; }
    .sidebar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      top: auto;
      height: auto;
      width: 100%;
      flex-direction: row;
      justify-content: space-around;

  }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" aria-label="Hauptnavigation">
    <div class="brand"><span class="brand-dot"></span><span>Study Hub<small>Wirtschaftsinformatik</small></span></div>

    </button>

        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="3" width="15" height="10" rx="2"></rect><path d="M6 16h6"></path></svg>
        <span id="layoutLabel">Ansicht: Breit</span>
      </button>
    </div>
  </nav>
  <main class="main" id="main"></main>
</div>

<script>
"use strict";

/* ============ Constants ============ */
const SEMESTER_START = "2026-03-01";
const SUBJECTS = ["GBI", "DIA", "Analysis", "BuB", "Prog2", "Allgemein"];
const SUBJECT_COLORS = {
  GBI:       "#62b6e0",
  DIA:       "#b98ae8",
  Analysis:  "#e0a35f",
  BuB:       "#5bc78a",
  Prog2:     "#e87f9a",
  Allgemein: "#8b8b9c"
};
const LANGUAGES = ["Java", "SQL", "Python", "Bash", "Other"];
const PRIO_COLORS = { high: "var(--red)", mid: "var(--amber)", low: "var(--green)" };
const PRIO_LABELS = { high: "Hoch", mid: "Mittel", low: "Niedrig" };
const COLS = [
  { key: "open",  label: "Offen" },
  { key: "doing", label: "In Arbeit" },
  { key: "done",  label: "Erledigt" }
];
const CIRC = 2 * Math.PI * 50;
const RTE_SIZES = [["2", "Klein"], ["3", "Normal"], ["5", "Groß"], ["6", "Riesig"]];
const RTE_FONTS = [
  ["system-ui, sans-serif", "Standard"],
  ["Georgia, serif", "Serif"],
  ["ui-monospace, monospace", "Mono"]
];
const RTE_COLORS = ["#e9e9f0", "#6B6EF9", "#62b6e0", "#5bc78a", "#e3b04b", "#e87f9a"];

/* ============ Storage ============ */
function load(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) { return fallback; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* Seed on first load */
if (localStorage.getItem("exams") === null) {
  save("exams", [
    { id: uid(), subject: "GBI",      date: "2026-06-25" },
    { id: uid(), subject: "DIA",      date: "2026-06-29" },
    { id: uid(), subject: "Analysis", date: "2026-07-01" },
    { id: uid(), subject: "BuB",      date: "2026-07-07" },
    { id: uid(), subject: "Prog2",    date: "2026-07-09" }
  ]);
}
if (localStorage.getItem("notes") === null) {
  save("notes", [{
    id: uid(),
    title: "Relationales Modell",
    subject: "DIA",
    content: "<h2>Normalformen</h2><ul><li><b>1NF</b>: Atomare Attributwerte</li><li><b>2NF</b>: Keine partiellen Abhängigkeiten</li><li><b>3NF</b>: Keine transitiven Abhängigkeiten</li></ul>",
    updatedAt: Date.now()
  }]);
}
if (localStorage.getItem("snippets") === null) {
  save("snippets", [{
    id: uid(),
    title: "ArrayList vs LinkedList",
    language: "Java",
    subject: "Prog2",
    description: "Wann welche Listen-Implementierung?",
    code: "// ArrayList: schneller Index-Zugriff O(1),\n// langsames Einfügen in der Mitte O(n)\nList<String> arrayList = new ArrayList<>();\n\n// LinkedList: schnelles Einfügen/Entfernen O(1)\n// am Anfang/Ende, langsamer Zugriff O(n)\nList<String> linkedList = new LinkedList<>();\n\n// Faustregel: fast immer ArrayList verwenden,\n// außer bei vielen Operationen an den Enden\n// -> dann ArrayDeque in Betracht ziehen.",
    updatedAt: Date.now()
  }]);
}
if (localStorage.getItem("todos") === null) { save("todos", []); }

/* ============ State ============ */
const state = {
  view: "dashboard",
  exams: load("exams", []),
  todos: load("todos", []),
  notes: load("notes", []),
  snippets: load("snippets", []),
  layout: load("layout", "wide"),
  selectedNoteId: null,
  noteEditing: false,
  noteSearch: "",
  langFilter: "Alle",
  snippetSearch: "",
  showExamForm: false,
  showSnippetForm: false,
  editSnippetId: null,
  addTaskCol: null,
  pendingImport: null,
  focusTarget: null
};

/* Migration: fields added in v2 */
let migrated = false;
state.snippets.forEach(function (s) {
  if (s.updatedAt === undefined) { s.updatedAt = Date.now(); migrated = true; }
  if (s.subject === undefined) { s.subject = ""; migrated = true; }
  if (s.description === undefined) { s.description = ""; migrated = true; }
});
state.todos.forEach(function (t) {
  if (t.due === undefined) { t.due = null; migrated = true; }
});
if (migrated) { save("snippets", state.snippets); save("todos", state.todos); }

function persist() {
  save("exams", state.exams);
  save("todos", state.todos);
  save("notes", state.notes);
  save("snippets", state.snippets);
}

/* ============ Helpers ============ */
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function daysUntil(dateStr) {
  const today = startOfDay(new Date());
  const target = startOfDay(new Date(dateStr + "T12:00:00"));
  return Math.round((target - today) / 86400000);
}
function fmtDate(dateStr) {
  return new Date(dateStr + "T12:00:00").toLocaleDateString("de-DE", {
    weekday: "short", day: "numeric", month: "long", year: "numeric"
  });
}
function fmtDateShort(dateStr) {
  return new Date(dateStr + "T12:00:00").toLocaleDateString("de-DE", {
    day: "2-digit", month: "2-digit", year: "numeric"
  });
}
function fmtDateTime(ts) {
  return new Date(ts).toLocaleString("de-DE", {
    day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit"
  });
}
function timeAgo(ts) {
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return "gerade eben";
  if (min < 60) return "vor " + min + " Min.";
  const h = Math.floor(min / 60);
  if (h < 24) return "vor " + h + " Std.";
  const d = Math.floor(h / 24);
  return d === 1 ? "gestern" : "vor " + d + " Tagen";
}
function urgencyClass(days) {
  if (days <= 7) return "red";
  if (days <= 14) return "amber";
  return "indigo";
}
function subjectPill(subject, asButton, onclickStr, active) {
  if (!subject) return "";
  const c = SUBJECT_COLORS[subject] || "var(--muted)";
  const style = "background:color-mix(in srgb, " + c + " 14%, transparent); color:" + c + ";" +
    (active ? "border-color:" + c + ";" : "");
  if (asButton) {
    return '<button type="button" class="pill" style="' + style + '" onclick="' + onclickStr + '">' + esc(subject) + "</button>";
  }
  return '<span class="pill" style="' + style + '">' + esc(subject) + "</span>";
}
function emptyState(msg) {
  return '<div class="empty">' +
    '<svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.5">' +
    '<circle cx="18" cy="18" r="14"></circle><path d="M12 22c1.8 1.6 4 2.4 6 2.4s4.2-.8 6-2.4" transform="rotate(180 18 21)"></path>' +
    '<circle cx="13" cy="15" r="1" fill="currentColor"></circle><circle cx="23" cy="15" r="1" fill="currentColor"></circle></svg>' +
    "<p>" + msg + "</p></div>";
}

/* ============ HTML helpers (notes are stored as HTML since v2) ============ */
function looksLikeHtml(s) { return /<\/?[a-z][\s\S]*>/i.test(s || ""); }
function sanitizeHtml(html) {
  return String(html || "")
    .replace(/<\/?(script|style|iframe|object|embed|link|meta)[^>]*>/gi, "")
    .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, "")
    .replace(/(href|src)\s*=\s*(['"]?)\s*javascript:[^'">]*\2/gi, '$1="#"');
}
function stripHtml(html) {
  return String(html || "")
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(p|div|li|h[1-6])>/gi, "\n")
    .replace(/<li[^>]*>/gi, "• ")
    .replace(/<[^>]+>/g, "")
    .replace(/&nbsp;/g, " ")
    .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .trim();
}
/* Legacy v1 notes were Markdown — converted to HTML on demand */
function renderMarkdown(src) {
  const blocks = [];
  let text = String(src).replace(/```([\s\S]*?)```/g, function (m, code) {
    blocks.push("<pre><code>" + esc(code.replace(/^\n/, "").replace(/\n$/, "")) + "</code></pre>");
    return "\u0000B" + (blocks.length - 1) + "\u0000";
  });
  text = esc(text);
  const lines = text.split("\n");
  let html = "", inList = false, para = [];
  function flushPara() {
    if (para.length) { html += "<p>" + inline(para.join("<br>")) + "</p>"; para = []; }
  }
  function closeList() { if (inList) { html += "</ul>"; inList = false; } }
  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  }
  for (const line of lines) {
    const blockMatch = line.match(/^\u0000B(\d+)\u0000\s*$/);
    if (blockMatch) { flushPara(); closeList(); html += blocks[+blockMatch[1]]; continue; }
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) { flushPara(); closeList(); const lvl = h[1].length; html += "<h" + lvl + ">" + inline(h[2]) + "</h" + lvl + ">"; continue; }
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    if (li) { flushPara(); if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + inline(li[1]) + "</li>"; continue; }
    if (line.trim() === "") { flushPara(); closeList(); continue; }
    para.push(line);
  }
  flushPara(); closeList();
  return html.replace(/\u0000B(\d+)\u0000/g, function (m, i) { return blocks[+i]; });
}
function noteHtml(n) {
  return looksLikeHtml(n.content) ? sanitizeHtml(n.content) : renderMarkdown(n.content);
}

/* Inline confirmation: button becomes "Sicher?" for 3s before executing */
const armed = {};
function confirmAction(btn, key, fn) {
  if (armed[key]) {
    clearTimeout(armed[key].timer);
    delete armed[key];
    fn();
    return;
  }
  const orig = btn.textContent;
  btn.textContent = "Sicher?";
  btn.classList.add("danger-armed");
  armed[key] = {
    timer: setTimeout(function () {
      delete armed[key];
      if (document.body.contains(btn)) {
        btn.textContent = orig;
        btn.classList.remove("danger-armed");
      }
    }, 3000)
  };
}

/* ============ Countdown ring ============ */
function ringSVG(exam) {
  const days = daysUntil(exam.date);
  let offset, center;
  if (days < 0) {
    offset = CIRC;
    center = '<span class="ring-days" style="color:var(--muted)">✓</span>';
  } else if (days === 0) {
    offset = 0;
    center = '<span class="ring-days today">Heute!</span>';
  } else {
    const total = Math.max(1, Math.round((startOfDay(new Date(exam.date + "T12:00:00")) - startOfDay(new Date(SEMESTER_START + "T12:00:00"))) / 86400000));
    const progress = Math.min(1, Math.max(0, days / total));
    offset = CIRC * progress;
    center = '<span class="ring-days">' + days + '</span><span class="ring-label">Tage</span>';
  }
  return '<div class="ring-wrap">' +
    '<svg width="120" height="120" viewBox="0 0 120 120">' +
    '<circle cx="60" cy="60" r="50" fill="none" stroke="var(--border)" stroke-width="6"></circle>' +
    '<circle class="ring-fg" cx="60" cy="60" r="50" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"' +
    ' stroke-dasharray="' + CIRC.toFixed(2) + '" stroke-dashoffset="' + CIRC.toFixed(2) + '" data-target="' + offset.toFixed(2) + '"></circle>' +
    "</svg>" +
    '<div class="ring-center">' + center + "</div></div>";
}
function animateRings() {
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      document.querySelectorAll(".ring-fg").forEach(function (el) {
        el.setAttribute("stroke-dashoffset", el.dataset.target);
      });
    });
  });
}

/* ============ Typed status line ============ */
let typeTimer = null;
function startTyping() {
  const el = document.getElementById("statusTyped");
  if (!el) return;
  const openTodos = state.todos.filter(function (t) { return t.status !== "done"; }).length;
  const lastChange = Math.max(0,
    ...state.notes.map(function (n) { return n.updatedAt || 0; }),
    ...state.snippets.map(function (s) { return s.updatedAt || 0; }));
  const status = state.notes.length + (state.notes.length === 1 ? " notiz" : " notizen") +
    " · " + state.snippets.length + (state.snippets.length === 1 ? " snippet" : " snippets") +
    " · " + openTodos + " to-do" + (openTodos === 1 ? "" : "s") + " offen" +
    (lastChange > 0 ? " · letzte änderung " + timeAgo(lastChange) : "");
  if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    el.textContent = status;
    return;
  }
  let i = 0;
  el.textContent = "";
  typeTimer = setInterval(function () {
    i += 1;
    el.textContent = status.slice(0, i);
    if (i >= status.length) { clearInterval(typeTimer); typeTimer = null; }
  }, 20);
}

/* ============ Pomodoro focus timer ============ */
const POMO_MIN = { focus: 25, break: 5 };
let pomo = load("pomo", { phase: "focus", running: false, endsAt: null, remaining: 25 * 60 });
function pomoSave() { save("pomo", pomo); }
function pomoRemaining() {
  return pomo.running ? Math.max(0, Math.round((pomo.endsAt - Date.now()) / 1000)) : pomo.remaining;
}
function pomoFmt(sec) {
  return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
}
function pomoToggle() {
  if (pomo.running) {
    pomo.remaining = pomoRemaining();
    pomo.running = false;
    pomo.endsAt = null;
  } else {
    pomo.endsAt = Date.now() + pomoRemaining() * 1000;
    pomo.running = true;
  }
  pomoSave();
  render();
}
function pomoReset() {
  pomo.running = false;
  pomo.endsAt = null;
  pomo.remaining = POMO_MIN[pomo.phase] * 60;
  pomoSave();
  render();
}
function pomoSwitchPhase() {
  pomo.phase = pomo.phase === "focus" ? "break" : "focus";
  pomoReset();
}
setInterval(function () {
  const rem = pomoRemaining();
  const el = document.getElementById("pomoTime");
  if (el) { el.textContent = pomoFmt(rem); }
  if (pomo.running) {
    document.title = "⏱ " + pomoFmt(rem) + " · Study Hub";
    if (rem <= 0) {
      pomo.phase = pomo.phase === "focus" ? "break" : "focus";
      pomo.running = false;
      pomo.endsAt = null;
      pomo.remaining = POMO_MIN[pomo.phase] * 60;
      pomoSave();
      if (state.view === "dashboard") { render(); }
    }
  } else if (document.title !== "Study Hub — Wirtschaftsinformatik") {
    document.title = "Study Hub — Wirtschaftsinformatik";
  }
}, 500);

/* ============ Views ============ */
function sortedExams() {
  return state.exams.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
}

function viewDashboard() {
  const upcoming = sortedExams().filter(function (e) { return daysUntil(e.date) >= 0; });
  const next = upcoming[0];
  const openTodos = state.todos.filter(function (t) { return t.status !== "done"; }).length;
  let html = '<h1 class="page-title">Dashboard</h1>' +
    '<p class="page-sub tight">' + new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) + "</p>" +
    '<p class="status-line"><span class="arrow">→</span> <span id="statusTyped"></span><span class="type-cursor" aria-hidden="true"></span></p>';

  html += '<div class="metric-grid">' +
    '<button class="card metric-card" onclick="go(\'exams\')"><span class="metric-label">Nächste Prüfung</span><span class="metric-value accent">' +
    (next ? daysUntil(next.date) + '<span class="unit">Tage · ' + esc(next.subject) + "</span>" : "—") +
    "</span></button>" +
    '<button class="card metric-card" onclick="go(\'todos\')"><span class="metric-label">Offene To-Dos</span><span class="metric-value">' + openTodos + "</span></button>" +
    '<button class="card metric-card" onclick="go(\'notes\')"><span class="metric-label">Notizen gesamt</span><span class="metric-value">' + state.notes.length + "</span></button>" +
    '<button class="card metric-card" onclick="go(\'code\')"><span class="metric-label">Code-Snippets</span><span class="metric-value">' + state.snippets.length + "</span></button>" +
    "</div>";

  html += '<div class="section-h"><span>Prüfungs-Countdown</span></div>';
  if (upcoming.length === 0) {
    html += emptyState("Keine anstehenden Prüfungen. Füge eine unter „Prüfungen“ hinzu.");
  } else {
    html += '<div class="ring-row">' + upcoming.map(function (e) {
      return '<div class="ring-card">' + ringSVG(e) +
        '<div class="ring-subject">' + esc(e.subject) + "</div>" +
        '<div class="ring-date">' + fmtDate(e.date) + "</div></div>";
    }).join("") + "</div>";
  }

  /* Feed + Fokus-Timer + Semesterfortschritt */
  html += '<div class="dash-grid">' +
    '<div class="card">' + feedHTML() + "</div>" +
    '<div class="dash-col">' + pomoHTML() + semesterHTML(upcoming) + "</div>" +
    "</div>";

  html += '<div class="quick-add">' +
    '<input type="text" id="quickAddInput" placeholder="Schnell ein To-Do hinzufügen …" onkeydown="if(event.key===\'Enter\')quickAdd()">' +
    '<button class="btn primary" onclick="quickAdd()">Hinzufügen</button></div>';
  return html;
}

function feedHTML() {
  const items = state.notes.map(function (n) { return { type: "note", item: n }; })
    .concat(state.snippets.map(function (s) { return { type: "snippet", item: s }; }))
    .filter(function (x) { return x.item.updatedAt > 0; })
    .sort(function (a, b) { return b.item.updatedAt - a.item.updatedAt; })
    .slice(0, 5);
  let html = '<div class="card-h"><span>Zuletzt im Hub</span></div>';
  if (items.length === 0) {
    return html + '<p style="color:var(--muted); font-size:0.88rem; padding:1rem 0;">Noch nichts erstellt — leg in „Notizen“ oder „Code“ los.</p>';
  }
  html += items.map(function (x) {
    const isNote = x.type === "note";
    const icon = isNote
      ? '<svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="1.5" width="12" height="15" rx="2"></rect><path d="M6 5.5h6M6 9h6M6 12.5h3.5"></path></svg>'
      : '<svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 4.5L1.5 9 6 13.5M12 4.5L16.5 9 12 13.5"></path></svg>';
    const onclick = isNote
      ? "openNoteFromFeed('" + x.item.id + "')"
      : "go('code')";
    return '<button class="feed-item" onclick="' + onclick + '">' +
      '<span class="feed-icon">' + icon + "</span>" +
      '<span class="feed-body"><span class="feed-title">' + esc(x.item.title || "Ohne Titel") + "</span>" +
      '<span class="feed-time">' + fmtDateTime(x.item.updatedAt) + " · " + timeAgo(x.item.updatedAt) + "</span></span>" +
      (x.item.subject ? subjectPill(x.item.subject) : "") +
      "</button>";
  }).join("");
  return html;
}

function pomoHTML() {
  const isBreak = pomo.phase === "break";
  return '<div class="card">' +
    '<div class="card-h"><span>Fokus-Timer</span>' +
    '<button class="btn ghost" onclick="pomoSwitchPhase()">' + (isBreak ? "→ Fokus" : "→ Pause") + "</button></div>" +
    '<div class="pomo-phase">' + (isBreak ? "Pause — kurz durchatmen" : "Fokus — 25 Minuten dranbleiben") + "</div>" +
    '<div class="pomo-time' + (isBreak ? " break" : "") + '" id="pomoTime">' + pomoFmt(pomoRemaining()) + "</div>" +
    '<div class="pomo-actions">' +
    '<button class="btn primary" onclick="pomoToggle()">' + (pomo.running ? "Pause" : "Start") + "</button>" +
    '<button class="btn" onclick="pomoReset()">Zurücksetzen</button>' +
    "</div></div>";
}

function semesterHTML(upcoming) {
  const last = upcoming.length ? upcoming[upcoming.length - 1] : null;
  if (!last) return "";
  const start = startOfDay(new Date(SEMESTER_START + "T12:00:00"));
  const end = startOfDay(new Date(last.date + "T12:00:00"));
  const today = startOfDay(new Date());
  const pct = Math.min(100, Math.max(0, Math.round((today - start) / (end - start) * 100)));
  const rest = daysUntil(last.date);
  return '<div class="card">' +
    '<div class="card-h"><span>Semesterfortschritt</span></div>' +
    '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="progress-meta"><span>' + pct + " %</span><span>noch " + rest + " Tage bis zur letzten Prüfung</span></div></div>";
}

function viewExams() {
  const all = sortedExams();
  const upcoming = all.filter(function (e) { return daysUntil(e.date) >= 0; });
  const past = all.filter(function (e) { return daysUntil(e.date) < 0; });
  let html = '<h1 class="page-title">Prüfungen</h1><p class="page-sub">Sommersemester · ' + upcoming.length + " anstehend</p>";

  if (state.showExamForm) {
    html += '<form class="inline-form" onsubmit="addExam(event)">' +
      '<input type="text" id="examSubject" placeholder="Fach, z. B. Statistik" required style="flex:2; min-width:180px;">' +
      '<input type="date" id="examDate" required>' +
      '<button type="submit" class="btn primary">Speichern</button>' +
      '<button type="button" class="btn ghost" onclick="state.showExamForm=false;render()">Abbrechen</button></form>';
  } else {
    html += '<div style="margin-bottom:1.25rem;"><button class="btn primary" onclick="state.showExamForm=true;state.focusTarget=\'examSubject\';render()">+ Prüfung hinzufügen</button></div>';
  }

  if (upcoming.length === 0) {
    html += emptyState("Keine anstehenden Prüfungen. Erstelle eine mit dem Button oben.");
  } else {
    html += '<div class="exam-list">' + upcoming.map(function (e) {
      const days = daysUntil(e.date);
      const cls = urgencyClass(days);
      const badgeText = days === 0 ? "Heute" : days <= 7 ? "Dringend" : days <= 14 ? "Bald" : "Geplant";
      return '<div class="card exam-card">' + ringSVG(e) +
        '<div class="exam-info"><div class="exam-name">' + esc(e.subject) +
        '<span class="badge ' + cls + '">' + badgeText + "</span></div>" +
        '<div class="exam-date">' + fmtDate(e.date) + " · in " + days + (days === 1 ? " Tag" : " Tagen") + "</div></div>" +
        '<button class="btn ghost" onclick="confirmAction(this,\'ex-' + e.id + '\',function(){deleteExam(\'' + e.id + '\')})">Löschen</button></div>';
    }).join("") + "</div>";
  }

  if (past.length > 0) {
    html += '<details class="past-section" style="margin-top:1.5rem;"><summary>Vergangen (' + past.length + ")</summary>" +
      '<div class="exam-list">' + past.map(function (e) {
        return '<div class="card exam-card past">' + ringSVG(e) +
          '<div class="exam-info"><div class="exam-name">' + esc(e.subject) + "</div>" +
          '<div class="exam-date">' + fmtDate(e.date) + "</div></div>" +
          '<button class="btn ghost" onclick="confirmAction(this,\'ex-' + e.id + '\',function(){deleteExam(\'' + e.id + '\')})">Löschen</button></div>';
      }).join("") + "</div></details>";
  }
  return html;
}

function dueTag(t) {
  if (!t.due) return "";
  const d = daysUntil(t.due);
  if (t.status === "done") {
    return '<span class="due-tag normal">' + fmtDateShort(t.due) + "</span>";
  }
  if (d < 0) return '<span class="due-tag overdue">überfällig · ' + fmtDateShort(t.due) + "</span>";
  if (d === 0) return '<span class="due-tag soon">HEUTE</span>';
  if (d === 1) return '<span class="due-tag soon">morgen</span>';
  return '<span class="due-tag normal">' + fmtDateShort(t.due) + "</span>";
}

function viewTodos() {

        '<div class="row"><input type="date" id="taskDue-' + col.key + '" style="flex:1;" title="Fällig am (optional)"></div>' +

function rteExec(cmd, val) {
  const ed = document.getElementById("rteEditor");
  if (!ed) return;
  ed.focus();
  document.execCommand("styleWithCSS", false, true);
  document.execCommand(cmd, false, val || null);
  updateNote("content", ed.innerHTML);
}

    .filter(function (s) { return state.langFilter === "Alle" || s.language === state.langFilter; })
    .filter(function (s) {
      return !q || s.title.toLowerCase().includes(q) || s.code.toLowerCase().includes(q) ||
        (s.subject || "").toLowerCase().includes(q) || (s.description || "").toLowerCase().includes(q);

  let html = '<h1 class="page-title">Code-Snippets</h1><p class="page-sub">' + state.snippets.length + " Snippets gespeichert</p>";

      '<select id="snippetLang">' + LANGUAGES.map(function (l) {

      '<textarea id="snippetCode" placeholder="Code hier einfügen …" required>' + (editing ? esc(editing.code) : "") + "</textarea>" +
      '<div class="form-actions"><button type="submit" class="btn primary">' + (editing ? "Aktualisieren" : "Speichern") + "</button>" +

    html += '<div style="margin-bottom:1.25rem;"><button class="btn primary" onclick="state.showSnippetForm=true;state.editSnippetId=null;state.focusTarget=\'snippetTitle\';render()">+ Neuer Snippet</button></div>';
  }

    html += '<div class="snippet-grid">' + filtered.map(function (s) {
      return '<div class="card snippet-card">' +
        '<div class="snippet-head"><span class="badge indigo">' + esc(s.language) + "</span>" +

/* ============ Footer (backup) ============ */
function footerHTML() {
  if (state.pendingImport) {
    return '<footer class="app-footer"><div class="import-bar">' +
      "<span>Import ersetzt alle aktuellen Daten auf diesem Gerät.</span>" +
      '<button class="btn primary" onclick="applyImport()">Übernehmen</button>' +
      '<button class="btn ghost" onclick="state.pendingImport=null;render()">Abbrechen</button>' +
      "</div></footer>";
  }
  return '<footer class="app-footer">' +
    '<div class="links">' +
    '<button onclick="exportBackup()" title="Alle Daten als JSON-Datei sichern">↓ Backup exportieren</button>' +
    '<button onclick="document.getElementById(\'importFile\').click()" title="Backup-Datei einspielen (ersetzt aktuelle Daten)">↑ importieren</button>' +
    '<input type="file" id="importFile" accept="application/json,.json" style="display:none;" onchange="importBackup(event)">' +
    "</div>" +
    "<span>Daten liegen nur lokal in diesem Browser (localStorage)</span>" +
    "</footer>";
}
function exportBackup() {
  const payload = {
    app: "study-hub",
    version: 2,
    exportedAt: new Date().toISOString(),
    exams: state.exams,
    todos: state.todos,
    notes: state.notes,
    snippets: state.snippets
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "study-hub-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
}
function importBackup(e) {
  const file = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!file) return;
  file.text().then(function (text) {
    let parsed;
    try { parsed = JSON.parse(text); } catch (err) { parsed = null; }
    if (!parsed || typeof parsed !== "object") {
      alert("Datei konnte nicht gelesen werden — ist das ein Study-Hub-Backup (.json)?");
      return;
    }
    state.pendingImport = parsed;
    render();
  });
}
function applyImport() {
  const p = state.pendingImport;
  const arr = function (x) { return Array.isArray(x) ? x : []; };
  state.exams = arr(p.exams);
  state.todos = arr(p.todos);
  state.notes = arr(p.notes);
  state.snippets = arr(p.snippets);
  state.pendingImport = null;
  state.selectedNoteId = state.notes.length ? state.notes[0].id : null;
  state.noteEditing = false;
  persist();
  render();
}

/* ============ Render ============ */
const VIEWS = { dashboard: viewDashboard, exams: viewExams, todos: viewTodos, notes: viewNotes, code: viewCode };
const VIEW_LABELS = { dashboard: "Dashboard", exams: "Prüfungen", todos: "To-Dos", notes: "Notizen", code: "Code-Snippets" };

function applyLayout() {
  const main = document.getElementById("main");
  main.classList.toggle("narrow", state.layout === "narrow");
  const label = document.getElementById("layoutLabel");
  if (label) { label.textContent = "Ansicht: " + (state.layout === "narrow" ? "Schmal" : "Breit"); }
}
function toggleLayout() {
  state.layout = state.layout === "narrow" ? "wide" : "narrow";
  save("layout", state.layout);
  applyLayout();
}

function render() {
  const main = document.getElementById("main");
  main.setAttribute("data-screen-label", VIEW_LABELS[state.view]);
  main.innerHTML = VIEWS[state.view]() + footerHTML();
  document.querySelectorAll(".nav-btn[data-view]").forEach(function (b) {
    b.classList.toggle("active", b.dataset.view === state.view);
  });
  animateRings();
  applyLayout();
  if (state.view === "dashboard") { startTyping(); }
  /* RTE: set editor content once per render (oninput never re-renders) */
  const ed = document.getElementById("rteEditor");
  if (ed) {
    const sel = state.notes.find(function (n) { return n.id === state.selectedNoteId; });
    ed.innerHTML = sel ? sanitizeHtml(sel.content) : "";
  }
  if (state.focusTarget) {
    const el = document.getElementById(state.focusTarget);
    if (el) { el.focus(); }
    state.focusTarget = null;
  }
}

function go(view) {
  state.view = view;
  state.addTaskCol = null;
  render();
}

/* ============ Actions: dashboard ============ */
function quickAdd() {
  const input = document.getElementById("quickAddInput");
  const title = input.value.trim();
  if (!title) return;
  state.todos.unshift({ id: uid(), title: title, subject: "", priority: "mid", status: "open", due: null });
  persist();
  state.focusTarget = "quickAddInput";
  render();
}
function openNoteFromFeed(id) {
  state.selectedNoteId = id;
  state.noteEditing = false;
  go("notes");
}

/* ============ Actions: exams ============ */
function addExam(e) {
  e.preventDefault();
  const subject = document.getElementById("examSubject").value.trim();
  const date = document.getElementById("examDate").value;
  if (!subject || !date) return;
  state.exams.push({ id: uid(), subject: subject, date: date });
  state.showExamForm = false;
  persist();
  render();
}
function deleteExam(id) {
  state.exams = state.exams.filter(function (e) { return e.id !== id; });
  persist();
  render();
}

/* ============ Actions: todos ============ */
function addTask(e, col) {
  e.preventDefault();
  const title = document.getElementById("taskInput-" + col).value.trim();
  if (!title) return;
  const subject = document.getElementById("taskSubject-" + col).value;
  const prio = document.getElementById("taskPrio-" + col).value;
  const due = document.getElementById("taskDue-" + col).value || null;
  state.todos.unshift({ id: uid(), title: title, subject: subject, priority: prio, status: col, due: due });
  state.addTaskCol = null;
  persist();
  render();
}
function deleteTodo(id) {
  state.todos = state.todos.filter(function (t) { return t.id !== id; });
  persist();
  render();
}
let dragId = null;
function dragStart(e) {
  dragId = e.currentTarget.dataset.id;
  e.currentTarget.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragId);
}
function dragEnd(e) {
  e.currentTarget.classList.remove("dragging");
  document.querySelectorAll(".kcol").forEach(function (c) { c.classList.remove("drag-over"); });
}
function dragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  e.currentTarget.classList.add("drag-over");
}
function dragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.classList.remove("drag-over");
  }
}
function drop(e) {
  e.preventDefault();
  const col = e.currentTarget.dataset.col;
  const id = e.dataTransfer.getData("text/plain") || dragId;
  const todo = state.todos.find(function (t) { return t.id === id; });
  if (todo && todo.status !== col) {
    todo.status = col;
    persist();
  }
  dragId = null;
  render();
}

/* ============ Actions: notes ============ */
function noteSearchInput(v) {
  state.noteSearch = v;
  const pos = document.getElementById("noteSearch").selectionStart;
  state.focusTarget = "noteSearch";
  render();
  const el = document.getElementById("noteSearch");
  if (el) { el.setSelectionRange(pos, pos); }
}
function newNote() {
  const n = { id: uid(), title: "", subject: "Allgemein", content: "", updatedAt: Date.now() };
  state.notes.unshift(n);
  state.selectedNoteId = n.id;
  state.noteEditing = true;
  state.noteSearch = "";
  state.focusTarget = "noteTitle";
  persist();
  render();
}
function selectNote(id) {
  state.selectedNoteId = id;
  state.noteEditing = false;
  render();
}
function editNote() {
  const n = state.notes.find(function (x) { return x.id === state.selectedNoteId; });
  if (!n) return;
  /* v1 notes were Markdown — convert once to HTML for the editor */
  if (n.content && !looksLikeHtml(n.content)) {
    n.content = renderMarkdown(n.content);
    persist();
  }
  state.noteEditing = true;
  state.focusTarget = "noteTitle";
  render();
}
function updateNote(field, value) {
  const n = state.notes.find(function (x) { return x.id === state.selectedNoteId; });
  if (!n) return;
  n[field] = value;
  n.updatedAt = Date.now();
  persist();
  if (field === "subject") { render(); }
}
function deleteNote(id) {
  state.notes = state.notes.filter(function (n) { return n.id !== id; });
  if (state.selectedNoteId === id) { state.selectedNoteId = null; state.noteEditing = false; }
  persist();
  render();
}

/* ============ Actions: snippets ============ */
function snippetSearchInput(v) {
  state.snippetSearch = v;
  const pos = document.getElementById("snippetSearch").selectionStart;
  state.focusTarget = "snippetSearch";
  render();
  const el = document.getElementById("snippetSearch");
  if (el) { el.setSelectionRange(pos, pos); }
}
function editSnippet(id) {
  state.editSnippetId = id;
  state.showSnippetForm = true;
  state.focusTarget = "snippetTitle";
  render();
}
function saveSnippet(e) {
  e.preventDefault();
  const title = document.getElementById("snippetTitle").value.trim();
  const language = document.getElementById("snippetLang").value;
  const subject = document.getElementById("snippetSubject").value;
  const description = document.getElementById("snippetDesc").value.trim();
  const code = document.getElementById("snippetCode").value;
  if (!title || !code.trim()) return;
  if (state.editSnippetId) {
    const s = state.snippets.find(function (x) { return x.id === state.editSnippetId; });
    if (s) {
      s.title = title; s.language = language; s.subject = subject;
      s.description = description; s.code = code; s.updatedAt = Date.now();
    }
  } else {
    state.snippets.unshift({ id: uid(), title: title, language: language, subject: subject, description: description, code: code, updatedAt: Date.now() });
  }
  state.showSnippetForm = false;
  state.editSnippetId = null;
  persist();
  render();
}
function deleteSnippet(id) {
  state.snippets = state.snippets.filter(function (s) { return s.id !== id; });
  persist();
  render();
}
function copySnippet(btn, id) {
  const s = state.snippets.find(function (x) { return x.id === id; });
  if (!s) return;
  function feedback() {
    btn.textContent = "Kopiert!";
    btn.style.color = "var(--green)";
    setTimeout(function () {
      if (document.body.contains(btn)) { btn.textContent = "Kopieren"; btn.style.color = ""; }
    }, 1500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(s.code).then(feedback, feedback);
  } else {
    const ta = document.createElement("textarea");
    ta.value = s.code;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (err) {}
    document.body.removeChild(ta);
    feedback();
  }
}

/* ============ Init ============ */
if (state.notes.length > 0 && state.selectedNoteId === null) {
  state.selectedNoteId = state.notes[0].id;
}
render();
</script>
</body>
</html>
